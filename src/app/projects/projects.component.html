<!-- src/app/projects/projects.component.html -->
<div class="page-container">

  <div class="section-header" appScrollReveal="reveal">
    <p class="section-overline">{{ 'PROJECTS.OVERLINE' | translate }}</p>
    <h2>{{ 'PROJECTS.TITLE' | translate }}</h2>
  </div>

  <app-timeline [entries]="entries()" [invite]="invite">
    <ng-template let-card>
      <app-experience-card
        [icon]="card.project.icon"
        [iconFill]="!!card.project.iconFill"
        [iconDark]="card.project.iconDark"
        [title]="card.project.name"
        [badge]="card.project.status === 'in-progress' ? ('PROJECTS.STATUS_IN_PROGRESS' | translate) : undefined"
        [summary]="card.project.summary"
        [skills]="card.project.skills"
        [links]="card.links"
      />
    </ng-template>
  </app-timeline>

</div>
