<!-- src/app/education/education.component.html -->
<div class="page-container">

  <div class="section-header" appScrollReveal="reveal">
    <p class="section-overline">{{ 'EDUCATION.OVERLINE' | translate }}</p>
    <h2>{{ 'EDUCATION.TITLE' | translate }}</h2>
  </div>
  <app-timeline [entries]="entries()">
    <ng-template let-edu>
      <app-experience-card
        [icon]="edu.icon"
        [title]="edu.title"
        [subtitle]="edu.school + ' · ' + edu.location"
        [bullets]="edu.descriptions"
        [skills]="edu.skills"
      />
    </ng-template>
  </app-timeline>

</div>
