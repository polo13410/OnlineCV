@if (target(); as page) {
  <div class="edge-hint" [class.at-top]="side() === 'top'" [class.ready]="ready()" aria-hidden="true">
    @if (side() === 'top') {
      <svg class="hint-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    }
    <span class="hint-label">
      <span class="hint-dir">{{ (side() === 'top' ? 'NAV.PREVIOUS' : 'NAV.NEXT') | translate }}</span>
      {{ page.label | translate }}
    </span>
    @if (side() === 'bottom') {
      <svg class="hint-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    }
    <span class="hint-progress"></span>
  </div>
}
