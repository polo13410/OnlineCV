<div class="shell" [class.mobile]="isMobile()" [class.nav-open]="isMobileNavOpen()">

  <app-nav
    [isMobile]="isMobile()"
    [isOpen]="!isMobile() || isMobileNavOpen()"
    (navToggle)="toggleNav()"
  />

  <div class="shell-content" (click)="onContentClick()">
    <header class="shell-topbar">
      @if (isMobile()) {
        <button class="hamburger" (click)="$event.stopPropagation(); toggleNav()" [attr.aria-label]="'Toggle navigation'">
          <span [class.open]="isMobileNavOpen()"></span>
          <span [class.open]="isMobileNavOpen()"></span>
          <span [class.open]="isMobileNavOpen()"></span>
        </button>
      } @else {
        <app-header-links show="cv" />
      }

      <div class="topbar-actions">
        @if (!isMobile()) {
          <app-lang-toggle />
        }
        <app-theme-toggle />
        @if (!isMobile()) {
          <span class="topbar-sep" aria-hidden="true"></span>
          <app-header-links show="social" />
        }
        <button class="contact-btn" type="button" (click)="contact.open('general')">
          {{ 'HEADER.CONTACT' | translate }}
        </button>
      </div>
    </header>

    <main class="shell-main">
      <router-outlet />
    </main>
  </div>

  <app-contact-dialog />

  @if (isMobile() && isMobileNavOpen()) {
    <div class="nav-backdrop" (click)="closeNav()"></div>
  }
</div>
